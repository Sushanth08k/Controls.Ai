[project]
name = "agentic-control-automation"
version = "0.1.0"
description = "Agentic Control Automation Platform"
readme = "PROJECT_CONTEXT.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary,pool]>=3.1.18",
    "sqlalchemy>=2.0.30",
    "temporalio>=1.6.0",
    "litellm>=1.40.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1.0",
    "cryptography>=42.0.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "import-linter>=2.0",
    "pip-licenses>=4.4.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "litellm.*",
    "temporalio.*",
    "langgraph.*",
    "langchain_core.*",
    "sse_starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-p no:langsmith"
